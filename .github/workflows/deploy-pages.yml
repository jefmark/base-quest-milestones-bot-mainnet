name: Deploy Base Quest to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:
  build:
    # Deploy from the repository's default branch only. Other branches run CI instead.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check complete browser upload
        run: python3 scripts/check-upload.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check public configuration
        run: node scripts/assert-release-approval.mjs
      - name: Require dependency security gate
        run: npm audit --audit-level=high
      - name: Validate project
        run: npm run check
      - name: Verify installed package import paths
        run: npm run check:imports
      - name: Compile contract
        run: npm run compile
      - name: Run contract tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Verify site files and official links
        run: node scripts/check-release-content.mjs dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
